# ============================================================
# 生产环境配置 (application-prod.yml)
# 默认随 application.yml 的 spring.profiles.active=druid,prod 激活；
# 也可通过环境变量 SPRING_PROFILES_ACTIVE 显式指定。
# 所有敏感值均通过环境变量注入，严禁把明文口令提交到仓库。
# ============================================================

# 服务器端口
server:
  port: ${SERVER_PORT:8080}

# 日志级别：生产环境关闭 debug
logging:
  level:
    com.allinone: ${LOG_LEVEL:info}
    org.springframework: warn

# 生产文件存储路径（默认落到用户主目录，Windows/Linux 均可写；可用 RUOYI_PROFILE 覆盖）
ruoyi:
  profile: ${RUOYI_PROFILE:${user.home}/allinone/uploadPath}

# 数据源（覆盖 application-druid.yml 中的 master 配置）
spring:
  datasource:
    druid:
      master:
        url: ${DB_URL:jdbc:mysql://localhost:3306/allinone?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8}
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      # 生产建议开启连接超时检测
      timeout: 10s
      lettuce:
        pool:
          min-idle: 5
          max-idle: 20
          max-active: 50
          max-wait: 5000ms

# token 密钥必须显式配置，避免使用默认值
token:
  secret: ${JWT_SECRET}

# 关闭 Swagger 文档暴露（生产不建议开放接口文档）
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

# 生产环境默认关闭 JimuReport 设计器，公网部署前应保持关闭；需要时显式设置 JIMUREPORT_UI_ENABLE=true 开启
jimureport:
  ui-enable: ${JIMUREPORT_UI_ENABLE:false}

# 防盗链（如需限制报表域名访问可开启）
referer:
  enabled: ${REFERER_ENABLED:false}
  allowed-domains: ${REFERER_ALLOWED_DOMAINS:}
